<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人工作台：整理任务、项目、资料与知识。" />
    <title>个人工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span id="avatarMark" class="brand-mark">W</span>
          <div>
            <strong>个人工作台</strong>
            <span class="owner-label">所有者：暗黑苏大强</span>
            <span id="modeLabel">访客只读</span>
          </div>
        </div>
        <div class="top-actions">
          <span id="storageNotice" class="storage-notice">数据保存在当前浏览器</span>
          <button id="shareButton" class="button secondary" type="button">复制只读链接</button>
          <button id="editModeButton" class="button primary" type="button">进入编辑</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <nav id="categoryNav" aria-label="工作台目录"></nav>
          <div class="sidebar-note">
            <span>本周整理</span>
            <strong id="weeklyCount">0 项待处理</strong>
          </div>
        </aside>

        <section class="content-panel">
          <div class="section-heading">
            <div>
              <p id="categoryEyebrow" class="eyebrow">工作空间</p>
              <h1 id="categoryTitle">收件箱</h1>
              <p id="categoryDescription" class="description"></p>
            </div>
            <button id="newItemButton" class="button primary edit-only" type="button">新建内容</button>
          </div>

          <div class="filter-row">
            <label class="search-field">
              <span>搜索</span>
              <input id="searchInput" type="search" placeholder="搜索当前目录" />
            </label>
            <div class="segmented" aria-label="内容筛选">
              <button class="segment active" data-filter="all" type="button">全部</button>
              <button class="segment" data-filter="active" type="button">进行中</button>
              <button class="segment" data-filter="done" type="button">已完成</button>
            </div>
          </div>

          <div id="knowledgeFilters" class="knowledge-filter-row" hidden>
            <label>知识类型
              <select id="knowledgeTypeFilter">
                <option value="all">全部类型</option>
                <option value="project-memory">项目记忆</option>
                <option value="person">人物信息</option>
                <option value="concept">概念与原理</option>
                <option value="method">方法与经验</option>
                <option value="decision">决策记录</option>
                <option value="source-summary">资料摘要</option>
              </select>
            </label>
            <label>知识状态
              <select id="knowledgeStatusFilter">
                <option value="all">全部状态</option>
                <option value="inbox">待整理</option>
                <option value="current">当前结论</option>
                <option value="draft">历史草稿</option>
                <option value="question">待确认问题</option>
              </select>
            </label>
          </div>
          <div id="knowledgeSummary" class="knowledge-summary" hidden></div>

          <div id="itemList" class="item-list"></div>
          <div id="emptyState" class="empty-state" hidden>
            <strong>这里还没有内容</strong>
            <span>切换到编辑模式后可以添加第一条记录。</span>
          </div>

          <section id="settingsPanel" class="settings-panel" hidden>
            <div class="settings-section">
              <div class="numbered-heading"><span>01</span><div><h2>自定义头像</h2><p>上传一张图案作为左上角头像。</p></div></div>
              <div class="avatar-setting">
                <span id="avatarPreview" class="brand-mark">W</span>
                <label class="upload-button">上传图案<input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" /></label>
                <button id="removeAvatar" class="button secondary" type="button">恢复默认</button>
              </div>
            </div>
            <div class="settings-section">
              <div class="numbered-heading"><span>02</span><div><h2>目录职责与加密</h2><p>切换目录访问保护，点击目录名称展开职责说明。</p></div></div>
              <form id="categoryAddForm" class="category-add-form">
                <input id="categoryIndexInput" inputmode="numeric" pattern="[0-9]{2}" placeholder="编号，如 07" required />
                <input id="categoryTitleInput" placeholder="模块名称" required />
                <input id="categoryDescriptionInput" placeholder="职责说明（可选）" />
                <button class="button primary" type="submit">新增模块</button>
              </form>
              <div id="encryptionList" class="encryption-list"></div>
            </div>
          </section>
        </section>

        <aside id="detailPanel" class="detail-panel">
          <div id="detailEmpty" class="detail-empty">
            <span class="detail-glyph">⌁</span>
            <strong>选择一条内容</strong>
            <p>在这里查看详情、进度和备注。</p>
          </div>

          <form id="detailForm" hidden>
            <div class="detail-header">
              <span id="detailCategory" class="pill"></span>
              <button id="deleteButton" class="icon-button danger edit-only" type="button" title="删除内容" aria-label="删除内容">×</button>
            </div>

            <label>
              标题
              <input id="itemTitle" name="title" required />
            </label>

            <div class="form-grid">
              <label>
                状态
                <select id="itemStatus" name="status">
                  <option value="active">进行中</option>
                  <option value="done">已完成</option>
                </select>
              </label>
              <label>
                日期
                <input id="itemDate" name="date" type="date" />
              </label>
            </div>

            <div id="knowledgeFields" class="knowledge-fields" hidden>
              <label>知识类型
                <select id="itemKnowledgeType">
                  <option value="">待分类</option>
                  <option value="project-memory">项目记忆</option>
                  <option value="person">人物信息</option>
                  <option value="concept">概念与原理</option>
                  <option value="method">方法与经验</option>
                  <option value="decision">决策记录</option>
                  <option value="source-summary">资料摘要</option>
                </select>
              </label>
              <div class="form-grid">
                <label>标签<input id="itemTags" list="tagSuggestions" placeholder="例如：项目A, 决策" /></label>
                <label>关联项目<input id="itemProject" list="projectSuggestions" placeholder="例如：项目A" /></label>
              </div>
              <label>关联人物<input id="itemPeople" list="peopleSuggestions" placeholder="例如：雷澍" /></label>
              <label>知识状态
                <select id="itemKnowledgeStatus">
                  <option value="inbox">待整理</option>
                  <option value="current">当前结论</option>
                  <option value="draft">历史草稿</option>
                  <option value="question">待确认问题</option>
                </select>
              </label>
            </div>
            <datalist id="tagSuggestions"></datalist>
            <datalist id="projectSuggestions"></datalist>
            <datalist id="peopleSuggestions"></datalist>

            <label>
              内容
              <textarea id="itemBody" name="body" rows="12"></textarea>
            </label>

            <div class="form-actions edit-only">
              <span id="saveHint">修改后自动保存</span>
              <button class="button primary" type="submit">保存</button>
            </div>
          </form>
        </aside>
      </main>
    </div>

    <dialog id="accessDialog">
      <form id="accessForm" method="dialog">
        <div class="dialog-heading">
          <span class="brand-mark small">W</span>
          <div>
            <strong id="accessTitle">开启编辑权限</strong>
            <p id="accessDescription">首次使用请设置一个本机编辑密钥。</p>
          </div>
        </div>
        <label>
          编辑密码
          <input id="accessKey" type="password" value="321" autocomplete="current-password" required />
        </label>
        <p id="accessError" class="error" hidden>密钥不正确，请重试。</p>
        <div class="dialog-actions">
          <button id="cancelAccess" class="button secondary" type="button">取消</button>
          <button class="button primary" type="submit">确认</button>
        </div>
      </form>
    </dialog>

    <dialog id="protectedDialog">
      <form id="protectedForm">
        <div class="dialog-heading">
          <span class="brand-mark small">06</span>
          <div>
            <strong id="protectedTitle">打开个人生活</strong>
            <p id="protectedDescription">该目录已加密，请输入访问密码。</p>
          </div>
        </div>
        <label id="protectedPasswordLabel">
          访问密码
          <input id="protectedPassword" type="password" inputmode="numeric" autocomplete="off" required />
        </label>
        <label id="recoveryAnswerLabel" hidden>
          作者为什么叫暗黑苏大强？
          <input id="recoveryAnswer" type="text" autocomplete="off" />
        </label>
        <label id="newProtectedPasswordLabel" hidden>
          设置新访问密码
          <input id="newProtectedPassword" type="password" minlength="3" autocomplete="new-password" />
        </label>
        <p id="protectedError" class="error" hidden>验证不正确，请重试。</p>
        <button id="recoveryToggle" class="text-button" type="button">忘记密码</button>
        <div class="dialog-actions">
          <button id="cancelProtected" class="button secondary" type="button">取消</button>
          <button class="button primary" type="submit">验证并打开</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
